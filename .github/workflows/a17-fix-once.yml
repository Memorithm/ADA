name: a17-fix-once

on:
  push:
    branches:
      - research/ada-advanced-references-current

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ada-advanced-references-current
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: apply strict-Clippy fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          recurrent = Path('crates/ada-advanced-reference/src/recurrent.rs')
          text = recurrent.read_text()
          replacements = [
              ('''        for value_index in 0..geometry.value_dimension {
              for key_index in 0..geometry.qk_dimension {
                  let index = value_index * geometry.qk_dimension + key_index;
                  state[index] = spec.decay * state[index]
                      + spec.learning_rate * value[value_index] * key[key_index];
              }
          }
''', '''        for (value_index, &value_component) in value.iter().enumerate() {
              for (key_index, &key_component) in key.iter().enumerate() {
                  let index = value_index * geometry.qk_dimension + key_index;
                  state[index] = spec.decay * state[index]
                      + spec.learning_rate * value_component * key_component;
              }
          }
'''),
              ('''        for dimension in 0..geometry.qk_dimension {
              let state_start = dimension * columns;
              for value_index in 0..geometry.value_dimension {
                  state[state_start + value_index] +=
                      key_features[dimension] * value[value_index];
              }
              state[state_start + geometry.value_dimension] += key_features[dimension];
          }
''', '''        for (dimension, &key_feature) in key_features.iter().enumerate() {
              let state_start = dimension * columns;
              for (value_index, &value_component) in value.iter().enumerate() {
                  state[state_start + value_index] += key_feature * value_component;
              }
              state[state_start + geometry.value_dimension] += key_feature;
          }
'''),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('expected recurrent Clippy pattern not found')
              text = text.replace(old, new, 1)
          recurrent.write_text(text)

          ring = Path('crates/ada-advanced-reference/src/ring.rs')
          text = ring.read_text()
          old = '''        for dimension in 0..value_dimension {
              numerator[dimension] += weight * shard.values[value_start + dimension];
          }
'''
          new = '''        for (dimension, numerator_value) in numerator.iter_mut().enumerate() {
              *numerator_value += weight * shard.values[value_start + dimension];
          }
'''
          if old not in text:
              raise SystemExit('expected ring loop pattern not found')
          text = text.replace(old, new, 1)
          old = '        assert_eq!(forward.maximum(), 1000.0);\n'
          new = '        assert!((forward.maximum() - 1000.0).abs() < 1.0e-12);\n'
          if old not in text:
              raise SystemExit('expected ring float assertion not found')
          ring.write_text(text.replace(old, new, 1))

          sparse = Path('crates/ada-advanced-reference/src/sparse.rs')
          text = sparse.read_text()
          for old, new in [
              ('        assert_eq!(result.output()[0], 20.0);\n', '        assert!((result.output()[0] - 20.0).abs() < 1.0e-12);\n'),
              ('        assert_eq!(result.output()[1], 10.0);\n', '        assert!((result.output()[1] - 10.0).abs() < 1.0e-12);\n'),
          ]:
              if old not in text:
                  raise SystemExit('expected sparse float assertion not found')
              text = text.replace(old, new, 1)
          sparse.write_text(text)
          PY
      - name: format
        run: cargo fmt --all
      - name: stable strict clippy
        run: cargo clippy -p ada-advanced-reference --all-targets --locked -- -D warnings
      - name: stable tests
        run: cargo test -p ada-advanced-reference --locked
      - name: install MSRV
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: MSRV check
        run: cargo +1.85.0 check -p ada-advanced-reference --all-targets --locked
      - name: commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ada-advanced-reference/src
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(a17): satisfy strict reference validation'
          git push origin HEAD:research/ada-advanced-references-current
