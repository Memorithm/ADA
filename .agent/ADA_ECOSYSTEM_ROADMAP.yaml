schema_version: 1
kind: ada_ecosystem_agent_roadmap
status: active
last_updated: "2026-09-23"
repository: Memorithm/ADA
intended_consumer: autonomous_coding_agent
merge_policy: never_merge_this_file_to_default_branch_unless_user_explicitly_requests

mission:
  primary: >-
    Preserve ADA as the deterministic research bench for discovering, falsifying,
    qualifying, and benchmarking attention algorithms. Candidate generation is
    cheap; adoption requires mathematical, oracle, adversarial, cost and hardware
    evidence.
  ecosystem_goal: >-
    Feed qualified attention semantics and implementation candidates to
    FLAT-ATTENTION while reusing SciRust reference primitives, TDI/ITD mechanistic
    evidence where relevant, and Forge only where its generic search machinery is
    stronger than ADA-specific bounded semantic search.

invariants:
  - ADA_is_not_a_production_attention_runtime
  - generation_never_implies_adoption
  - every_candidate_requires_independent_reference_oracle_and_adversarial_tests
  - logical_operation_counts_are_not_physical_hardware_performance
  - novelty_claims_require_dedicated_prior_art_review
  - semantic_identity_is_separate_from_implementation_schedule_and_memory_identity
  - no_candidate_is_promoted_to_FLAT_GPU_execution_without_FLAT_correctness_and_hardware_gates
  - required_CI_must_be_green_on_exact_PR_head_before_merge

ownership:
  role: attention_algorithm_discovery_and_semantic_qualification_bench
  owns:
    - attention_candidate_semantic_programs_and_canonical_identity
    - attention_specific_CEGIS_falsification_and_adversarial_counterexample_loop
    - attention_specific_objective_and_evidence_registry
    - backend_neutral_attention_implementation_IR_for_candidate_study
  does_not_own:
    - FLAT_ATTENTION_production_kernel_runtime_or_device_selection
    - Forge_general_evolutionary_search_engine
    - SciRust_general_tensor_scientific_oracle_ownership
    - TDI_dynamic_recovery_or_ITD_structural_research_semantics
    - ElasticXxx_generic_runtime_adaptation

pipeline:
  - GENERATE
  - PROVE_OR_FALSIFY
  - RUN_INDEPENDENT_ORACLE
  - ADVERSARIAL_TEST
  - ACCOUNT_LOGICAL_AND_MEMORY_COST
  - BENCHMARK_REAL_HARDWARE_WHEN_RELEVANT
  - PRIOR_ART_REVIEW_IF_NOVELTY_IS_CANDIDATE
  - ADOPT_ADAPT_REJECT_OR_DISCOVER

