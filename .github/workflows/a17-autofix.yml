name: a17-autofix

on:
  push:
    branches:
      - research/ada-advanced-references-current

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ada-advanced-references-current
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: apply source fixes
        run: python3 tools/a17_fix.py
      - name: format
        run: cargo fmt --all
      - name: clippy
        run: cargo clippy -p ada-advanced-reference --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test -p ada-advanced-reference --locked
      - name: install MSRV
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: MSRV
        run: cargo +1.85.0 check -p ada-advanced-reference --all-targets --locked
      - name: push validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ada-advanced-reference/src
          git diff --cached --quiet && exit 0
          git commit -m 'fix(a17): satisfy strict reference validation'
          git push origin HEAD:research/ada-advanced-references-current
