name: Native AArch64 qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/ada-a1-neon/**"
      - "crates/ada-core/**"
      - "crates/ada-search/**"
      - "crates/ada-cegis/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/native-aarch64.yml"
      - "docs/NATIVE_AARCH64_QUALIFICATION.md"
  push:
    branches: [main]
    paths:
      - "crates/ada-a1-neon/**"
      - "crates/ada-core/**"
      - "crates/ada-search/**"
      - "crates/ada-cegis/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/native-aarch64.yml"
      - "docs/NATIVE_AARCH64_QUALIFICATION.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-aarch64-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QUALIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  native-aarch64:
    name: Native AArch64 / NEON
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, scirust-arm64, jetson-thor, internal]
    timeout-minutes: 30
    steps:
      - name: Check out the exact qualification SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.QUALIFICATION_SHA }}

      - name: Require a native AArch64 host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "${RUNNER_ARCH}" = "ARM64"
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SHA"
          test -z "$(git status --porcelain)"
          uname -a
          lscpu
          grep -qm1 -E '^Features[[:space:]]*:.*(^|[[:space:]])asimd([[:space:]]|$)' /proc/cpuinfo

      - name: Install the exact workspace MSRV
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.85.0
          components: clippy

      - name: Verify the locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          rustc +1.85.0 --version --verbose
          cargo +1.85.0 --version
          cargo +1.85.0 metadata --locked --format-version 1 >/dev/null

      - name: Prove the native NEON and scalar-tail fixture is selected
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 test -p ada-a1-neon --locked -- --list             | tee "$RUNNER_TEMP/ada-a1-neon-tests.txt"
          grep -F "tests::neon_parity_with_odd_head_dims_and_logits: test"             "$RUNNER_TEMP/ada-a1-neon-tests.txt"

      - name: Run native NEON parity and scalar-tail tests
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 test -p ada-a1-neon --locked -- --nocapture
          cargo +1.85.0 clippy -p ada-a1-neon --all-targets --locked -- -D warnings

      - name: Build bounded signed provenance
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/ada-native-aarch64"
          mkdir -p "$evidence_dir"
          EVIDENCE_DIR="$evidence_dir" python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import subprocess

          def command(*args: str) -> str:
              return subprocess.run(
                  args,
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              ).stdout.strip()

          def lscpu_value(label: str, *, required: bool = True):
              prefix = f"{label}:"
              for line in command("lscpu").splitlines():
                  if line.startswith(prefix):
                      return line.split(":", 1)[1].strip()
              if required:
                  raise RuntimeError(f"missing lscpu field: {label}")
              return None

          root = pathlib.Path.cwd()
          device_model = lscpu_value("Model name", required=False)
          device_tree_model = pathlib.Path("/proc/device-tree/model")
          if (not device_model or device_model == "-") and device_tree_model.is_file():
              device_model = device_tree_model.read_bytes().rstrip(b"\0").decode("utf-8")
          if not device_model or device_model == "-":
              raise RuntimeError("missing bounded native device model provenance")
          features = next(
              (
                  line.split(":", 1)[1].strip()
                  for line in pathlib.Path("/proc/cpuinfo").read_text(
                      encoding="utf-8", errors="replace"
                  ).splitlines()
                  if line.startswith("Features")
              ),
              None,
          )
          if not features or "asimd" not in features.split():
              raise RuntimeError("native host does not report the required ASIMD feature")
          output = pathlib.Path(os.environ["EVIDENCE_DIR"])
          evidence = {
              "schema": "ada.native-aarch64-qualification.v1",
              "source_sha": os.environ["QUALIFICATION_SHA"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "runner": {
                  "os": os.environ["RUNNER_OS"],
                  "arch": os.environ["RUNNER_ARCH"],
                  "machine": platform.machine(),
                  "cpu_model": device_model,
                  "cpu_count": lscpu_value("CPU(s)"),
                  "cpu_features": features,
                  "byte_order": lscpu_value("Byte Order"),
              },
              "toolchain": {
                  "rustc": command("rustc", "+1.85.0", "--version", "--verbose"),
                  "cargo": command("cargo", "+1.85.0", "--version"),
              },
              "inputs": {
                  "cargo_lock_sha256": hashlib.sha256(
                      (root / "Cargo.lock").read_bytes()
                  ).hexdigest(),
                  "workflow_sha256": hashlib.sha256(
                      (root / ".github/workflows/native-aarch64.yml").read_bytes()
                  ).hexdigest(),
              },
              "tests": [{
                  "command": "cargo +1.85.0 test -p ada-a1-neon --locked -- --nocapture",
                  "result": "passed",
                  "covers": [
                      "native aarch64 selection",
                      "NEON parity against scalar references",
                      "odd head dimensions 1, 3 and 5 exercise scalar tails",
                      "full four-lane chunks at dimensions 4 and 8",
                      "ascending, descending, equal and singleton logits",
                  ],
              }],
              "claims": {
                  "native_aarch64_qualified": True,
                  "neon_path_executed": True,
                  "physical_performance_claim": False,
                  "gpu_claim": False,
              },
          }
          (output / "qualification.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd "$evidence_dir"
            sha256sum qualification.json > qualification.sha256
          )
          openssl genpkey -algorithm ED25519 -out "$evidence_dir/private.pem"
          openssl pkey -in "$evidence_dir/private.pem"             -pubout -out "$evidence_dir/qualification.pub.pem"
          openssl pkeyutl -sign -rawin             -inkey "$evidence_dir/private.pem"             -in "$evidence_dir/qualification.json"             -out "$evidence_dir/qualification.sig"
          openssl pkeyutl -verify -rawin             -pubin -inkey "$evidence_dir/qualification.pub.pem"             -in "$evidence_dir/qualification.json"             -sigfile "$evidence_dir/qualification.sig"
          rm -f "$evidence_dir/private.pem"

      - name: Upload native qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ada-native-aarch64-${{ env.QUALIFICATION_SHA }}
          path: |
            ${{ runner.temp }}/ada-native-aarch64/qualification.json
            ${{ runner.temp }}/ada-native-aarch64/qualification.sha256
            ${{ runner.temp }}/ada-native-aarch64/qualification.pub.pem
            ${{ runner.temp }}/ada-native-aarch64/qualification.sig
            ${{ runner.temp }}/ada-a1-neon-tests.txt
          if-no-files-found: error
          retention-days: 30

      - name: Refuse implicit source or lockfile mutation
        if: always()
        run: git diff --exit-code HEAD -- Cargo.lock .github/workflows/native-aarch64.yml crates/ada-a1-neon
