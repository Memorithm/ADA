  - id: ADA3
    name: TDI_ITD mechanistic discrimination
    status: conditional_after_TDI7_1
    goals:
      - expose_controlled_intervention_state_for_frozen_candidate_semantics
      - compare_static_ADA_diagnostics_ITD_and_TDI_descriptors_with_ablation
      - preserve_negative_results
  - id: ADA4
    name: FLAT promotion envelope
    status: reference_handoff_implemented_runtime_promotion_external
    evidence:
      qualification_bridge_pr: 21
      graduation_bundle_pr: 22
      replay_bundle_pr: 23
    goals:
      - preserve_versioned_candidate_math_semantic_hash_reference_vectors_tolerances_and_known_failure_modes
      - provide_cost_model_without_speed_claim
      - require_FLAT_independent_implementation_and_device_qualification
  - id: ADA5
    name: Search-engine convergence
    status: planned
    goals:
      - audit_overlap_between_ada_search_and_Forge
      - retain_ADA_specific_semantic_CEGIS_where_domain_knowledge_is_essential
      - delegate_generic_evolutionary_or_hardware_candidate_search_to_Forge_when_it_reduces_duplication
  - id: ADA6
    name: Evidence and ecosystem integration
    status: planned
    goals:
      - SciRust_Verify_evidence_envelope
      - Hub_research_component_contract
      - ElasticXxx_consumption_only_for_FLAT_or_other_runtime_qualified_candidates

agent_operating_protocol:
  must_read_this_file:
    - at_start_of_every_agent_session
    - before_candidate_semantic_or_evidence_rule_changes
    - before_FLAT_TDI_ITD_Forge_or_SciRust_integration
    - before_any_adoption_novelty_or_merge_decision
  must_update_this_file:
    - when_candidate_status_changes
    - when_a_new_evidence_gate_or_semantic_contract_is_added
    - when_cross_repository_integration_status_changes
  fail_closed: >-
    If this roadmap cannot be read, do not make major semantic-adoption, novelty,
    cross-repository promotion, or merge decisions. Read-only diagnosis is allowed.
