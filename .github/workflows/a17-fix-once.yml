name: a17-fix-once

on:
  push:
    branches:
      - research/ada-advanced-references-current

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ada-advanced-references-current
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: format
        run: cargo fmt --all
      - name: stable strict clippy
        run: cargo clippy -p ada-advanced-reference --all-targets --locked -- -D warnings
      - name: stable tests
        run: cargo test -p ada-advanced-reference --locked
      - name: install MSRV
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: MSRV check
        run: cargo +1.85.0 check -p ada-advanced-reference --all-targets --locked
      - name: commit validated format
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ada-advanced-reference/src
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'style(a17): apply rustfmt to advanced references'
          git push origin HEAD:research/ada-advanced-references-current
