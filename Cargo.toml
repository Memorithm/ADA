[workspace]
resolver = "3"
members = [
    "crates/ada-a2-k-first-v-late",
    "crates/ada-a2-real-v-trace",
    "crates/ada-a4-entmax-bnb",
    "crates/ada-a4-qk-box",
    "crates/ada-a5-content-aware-bounds",
    "crates/ada-a5-hierarchical-bounds",
    "crates/ada-a5-real-qk-trace",
    "crates/ada-core",
    "crates/ada-oracle",
    "crates/ada-runner",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
