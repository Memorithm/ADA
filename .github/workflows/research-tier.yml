name: research-tier

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

concurrency:
  group: research-tier-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-regression:
    name: release workspace regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
      - name: release tests
        run: cargo test --workspace --release --locked
      - name: all-target all-feature check
        run: cargo check --workspace --all-targets --all-features --locked
