[package]
name = "ada-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ada-core]
path = "../crates/ada-core"

[dependencies.ada-oracle]
path = "../crates/ada-oracle"

[dependencies.ada-a5-real-qk-trace]
path = "../crates/ada-a5-real-qk-trace"

[dependencies.ada-a2-real-v-trace]
path = "../crates/ada-a2-real-v-trace"

[[bin]]
name = "aqk01_parser"
path = "fuzz_targets/aqk01_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "adav01_parser"
path = "fuzz_targets/adav01_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "a1_softmax_parity"
path = "fuzz_targets/a1_softmax_parity.rs"
test = false
doc = false
bench = false

[workspace]

[dependencies.ada-ir]
path = "../crates/ada-ir"

[[bin]]
name = "ir_interpreter"
path = "fuzz_targets/ir_interpreter.rs"
test = false
bench = false

[dependencies.ada-a3-certified-softmax]
path = "../crates/ada-a3-certified-softmax"

[dependencies.ada-a10-evidence-schema]
path = "../crates/ada-a10-evidence-schema"

[dependencies.ada-a9-plan-selector]
path = "../crates/ada-a9-plan-selector"

[[bin]]
name = "a3_budget_softmax"
path = "fuzz_targets/a3_budget_softmax.rs"
test = false
bench = false

[[bin]]
name = "a10_evidence_record"
path = "fuzz_targets/a10_evidence_record.rs"
test = false
bench = false

[[bin]]
name = "a9_plan_selector"
path = "fuzz_targets/a9_plan_selector.rs"
test = false
bench = false
