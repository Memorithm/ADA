name: a18-fix-once

on:
  push:
    branches:
      - research/ada-precision-reference

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ada-precision-reference
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: restore MSRV and strict lint compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ada-precision-reference/src/lib.rs')
          text = path.read_text()
          replacements = [
              (
                  """        if let Self::I8Symmetric { scale } = self\n            && (!scale.is_finite() || *scale <= 0.0)\n        {\n            return Err(PrecisionReferenceError::InvalidScale);\n        }""",
                  """        if let Self::I8Symmetric { scale } = self {\n            if !scale.is_finite() || *scale <= 0.0 {\n                return Err(PrecisionReferenceError::InvalidScale);\n            }\n        }""",
              ),
              (
                  "let highest_bit = 63_i32 - fraction.leading_zeros() as i32;",
                  "let highest_bit = 63_i32\n        - i32::try_from(fraction.leading_zeros()).expect(\"leading-zero count fits i32\");",
              ),
              (
                  "f64::from_bits(((exponent + 1023) as u64) << 52)",
                  "f64::from_bits(\n        u64::try_from(exponent + 1023).expect(\"biased exponent is non-negative\") << 52,\n    )",
              ),
              (
                  "assert_eq!(spec.quantize(PrecisionStage::Input, halfway).unwrap(), 1.0);",
                  "assert_eq!(\n            spec.quantize(PrecisionStage::Input, halfway)\n                .unwrap()\n                .to_bits(),\n            1.0_f64.to_bits()\n        );",
              ),
              (
                  "assert_eq!(spec.quantize(PrecisionStage::Input, 0.26).unwrap(), 0.5);",
                  "assert_eq!(\n            spec.quantize(PrecisionStage::Input, 0.26)\n                .unwrap()\n                .to_bits(),\n            0.5_f64.to_bits()\n        );",
              ),
              (
                  "assert_eq!(spec.quantize(PrecisionStage::Input, 1.25).unwrap(), 1.0);",
                  "assert_eq!(\n            spec.quantize(PrecisionStage::Input, 1.25)\n                .unwrap()\n                .to_bits(),\n            1.0_f64.to_bits()\n        );",
              ),
              (
                  "assert_eq!(spec.quantize(PrecisionStage::Input, 2.8).unwrap(), 3.0);",
                  "assert_eq!(\n            spec.quantize(PrecisionStage::Input, 2.8)\n                .unwrap()\n                .to_bits(),\n            3.0_f64.to_bits()\n        );",
              ),
              (
                  "assert_eq!(report.output(), 2.0);",
                  "assert_eq!(report.output().to_bits(), 2.0_f64.to_bits());",
              ),
              (
                  "ExecutablePrecision::I8Symmetric { scale: 0.1 },",
                  "ExecutablePrecision::I8Symmetric { scale: 0.125 },",
              ),
              (
                  "assert!((spec.quantize(PrecisionStage::Input, 0.15).unwrap() - 0.2).abs() < 1.0e-15);",
                  "assert_eq!(\n            spec.quantize(PrecisionStage::Input, 0.1875)\n                .unwrap()\n                .to_bits(),\n            0.25_f64.to_bits()\n        );",
              ),
              (
                  "assert!((spec.quantize(PrecisionStage::Input, 99.0).unwrap() - 12.7).abs() < 1.0e-15);",
                  "assert_eq!(\n            spec.quantize(PrecisionStage::Input, 99.0)\n                .unwrap()\n                .to_bits(),\n            15.875_f64.to_bits()\n        );",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected pattern not found: {old!r}')
              text = text.replace(old, new, 1)
          old = "assert_eq!(spec.quantize(PrecisionStage::Input, halfway).unwrap(), 1.0);"
          new = """assert_eq!(\n            spec.quantize(PrecisionStage::Input, halfway)\n                .unwrap()\n                .to_bits(),\n            1.0_f64.to_bits()\n        );"""
          if old not in text:
              raise SystemExit('second halfway assertion not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: format
        run: cargo fmt --all
      - name: stable strict clippy
        run: cargo clippy -p ada-precision-reference --all-targets --locked -- -D warnings
      - name: stable tests
        run: cargo test -p ada-precision-reference --locked
      - name: install MSRV
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: MSRV check
        run: cargo +1.85.0 check -p ada-precision-reference --all-targets --locked
      - name: commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ada-precision-reference/src/lib.rs
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(a18): preserve MSRV and exact lattice invariants'
          git push origin HEAD:research/ada-precision-reference
