name: a17-clippy-fix-once

on:
  push:
    branches:
      - research/ada-advanced-references-current

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ada-advanced-references-current
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply exact Clippy fixes
        run: python3 tools/a17_clippy_fix.py
      - name: Format
        run: cargo fmt --all
      - name: Strict Clippy
        run: cargo clippy -p ada-advanced-reference --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test -p ada-advanced-reference --locked
      - name: Commit validated source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ada-advanced-reference/src
          git diff --cached --quiet && exit 0
          git commit -m "fix(a17): satisfy strict Clippy validation"
          git push origin HEAD:research/ada-advanced-references-current
