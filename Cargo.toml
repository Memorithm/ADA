[workspace]
resolver = "3"
members = [
    "crates/ada-a1-neon",
    "crates/ada-a10-evidence-schema",
    "crates/ada-a11-semantic-oracle",
    "crates/ada-a7-composable-entmax",
    "crates/ada-a6-tau-solvers",
    "crates/ada-a9-dispatch",
    "crates/ada-a9-plan-selector",
    "crates/ada-ir",
    "crates/ada-a3-certified-softmax",
    "crates/ada-a2-k-first-v-late",
    "crates/ada-a2-real-v-trace",
    "crates/ada-a4-entmax-bnb",
    "crates/ada-a4-qk-box",
    "crates/ada-a5-content-aware-bounds",
    "crates/ada-a5-hierarchical-bounds",
    "crates/ada-a5-real-qk-trace",
    "crates/ada-core",
    "crates/ada-oracle",
    "crates/ada-runner",
    "crates/ada-search",
    "crates/ada-workload",
    "crates/ada-semantic",
    "crates/ada-cegis",
    "crates/ada-objective",
    "crates/ada-implementation",
    "crates/ada-cost-model",
    "crates/ada-qualification",
    "crates/ada-graduation",
    "crates/ada-replay",
    "crates/ada-equivalence",
    "crates/ada-experiment",
    "crates/ada-backward",
    "crates/ada-trace",
    "crates/ada-gradient",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
