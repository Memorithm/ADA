name: a17-format-export

on:
  pull_request:
    paths:
      - 'crates/ada-advanced-reference/**'
      - '.github/workflows/a17-format-export.yml'

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: format advanced reference
        run: cargo fmt --all
      - uses: actions/upload-artifact@v4
        with:
          name: a17-formatted-source
          path: crates/ada-advanced-reference/src
          if-no-files-found: error
